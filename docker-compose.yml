# Shared by every service built from this repo. Timings can be overridden from the
# shell, e.g. `DJOS_LEASE_TTL_SECONDS=6 docker compose up -d` for a quick crash demo.
x-djos-env: &djos-env
  DJOS_DATABASE_URL: postgresql+asyncpg://djos:djos@postgres:5432/djos
  DJOS_REDIS_URL: redis://redis:6379/0
  DJOS_LOG_FORMAT: json
  DJOS_LEASE_TTL_SECONDS: ${DJOS_LEASE_TTL_SECONDS:-30}
  DJOS_HEARTBEAT_INTERVAL_SECONDS: ${DJOS_HEARTBEAT_INTERVAL_SECONDS:-10}
  DJOS_MONITOR_INTERVAL_SECONDS: ${DJOS_MONITOR_INTERVAL_SECONDS:-5}
  DJOS_RETRY_BASE_SECONDS: ${DJOS_RETRY_BASE_SECONDS:-1}
  # Tenancy: the admin API is off unless a token (16+ chars) is given; keys optional by default.
  DJOS_ADMIN_TOKEN: ${DJOS_ADMIN_TOKEN:-}
  DJOS_REQUIRE_API_KEY: ${DJOS_REQUIRE_API_KEY:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: djos
      POSTGRES_PASSWORD: djos
      POSTGRES_DB: djos
    ports:
      - "${DJOS_PG_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djos -d djos"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "${DJOS_REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    image: djos:local
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *djos-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: djos:local
    environment: *djos-env
    ports:
      - "${DJOS_API_HOST_PORT:-58000}:8000"
    healthcheck:
      # The slim image has no curl, so use Python's stdlib to hit the liveness probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: djos:local
    command: ["python", "-m", "djos.worker"]
    environment: *djos-env
    # Give an in-flight job time to finish after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    image: djos:local
    command: ["python", "-m", "djos.scheduler"]
    environment: *djos-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  monitor:
    image: djos:local
    command: ["python", "-m", "djos.monitor"]
    environment: *djos-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "${DJOS_PROMETHEUS_HOST_PORT:-59090}:9090"

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # local demo: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${DJOS_GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/djos.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${DJOS_GRAFANA_HOST_PORT:-53000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
