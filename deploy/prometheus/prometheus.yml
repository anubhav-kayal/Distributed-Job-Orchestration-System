global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Compose's DNS returns one A record per replica of a service, so every worker
  # container is discovered and scraped individually; scaling needs no config change.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 5s

  - job_name: monitor
    dns_sd_configs:
      - names: ["monitor"]
        type: A
        port: 9100
        refresh_interval: 5s

  - job_name: scheduler
    dns_sd_configs:
      - names: ["scheduler"]
        type: A
        port: 9100
        refresh_interval: 5s
