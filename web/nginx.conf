server {
    listen 80;
    root /usr/share/nginx/html;

    # The console calls /api/...; strip the prefix and hand it to the API service.
    # One origin for the browser, so no CORS configuration is needed.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Hashed assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/jobs/123, /workflows/...) all serve the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
